<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>云裳商城 · 本季精选</title>
  <meta name="description" content="云裳商城是「衣见 ATELIER」内置的模拟商城，仅用于课程演示。" />
  <link rel="stylesheet" href="mall.css" />
</head>
<body data-page="home">
  <header class="mall-topbar">
    <a class="mall-brand" href="index.html">
      <span class="mall-brand-mark">云</span>
      <span class="mall-brand-text">
        <strong>云裳商城</strong>
        <em>YUNSHANG MALL</em>
      </span>
    </a>
    <nav class="mall-nav" aria-label="商城导航">
      <a href="index.html" class="is-active">全部商品</a>
      <a href="index.html?q=外套">外套</a>
      <a href="index.html?q=上装">上装</a>
      <a href="index.html?q=连衣裙">连衣裙</a>
      <a href="index.html?q=下装">下装</a>
      <a href="index.html?q=配饰">配饰</a>
    </nav>
    <span class="mall-demo-badge">模拟商城 · 课程演示</span>
  </header>

  <main>
    <section class="mall-hero">
      <div class="mall-hero-inner">
        <p class="mall-eyebrow">SEASON EDIT · 云端衣橱</p>
        <h1>把云端的衣裳，<br />穿到人间。</h1>
        <p class="mall-hero-copy">
          云裳商城是衣见 ATELIER 的内置模拟商城。这里的商品、结算与支付全部为课程演示而生，
          不连接真实电商与支付渠道。
        </p>
        <form id="mall-search-form" class="mall-search" role="search" autocomplete="off">
          <label class="mall-search-label" for="mall-search">搜索云裳</label>
          <div class="mall-search-row">
            <input
              id="mall-search"
              data-testid="mall-search"
              name="q"
              type="search"
              placeholder="试试搜索：风衣 / 真丝衬衫 / 阔腿裤"
              aria-label="搜索商品"
            />
            <button type="submit" class="mall-search-btn">搜索</button>
          </div>
        </form>
        <div class="mall-hero-meta">
          <span>本地商品图</span>
          <span>模拟支付</span>
          <span>无真实账号</span>
        </div>
      </div>
      <div class="mall-hero-visual" aria-hidden="true">
        <div class="mall-hero-frame">
          <img src="/static/images/hero/hero-1.webp" alt="" loading="eager" />
        </div>
        <span class="mall-hero-stamp">云裳<br />选集</span>
      </div>
    </section>

    <section class="mall-catalog">
      <div class="mall-catalog-head">
        <div>
          <p class="mall-eyebrow">CURATED PIECES</p>
          <h2 id="mall-result-title">本季精选</h2>
        </div>
        <p class="mall-result-count" id="mall-result-count" aria-live="polite"></p>
      </div>
      <div id="mall-grid" class="mall-grid" aria-busy="true">
        <div class="mall-skeleton"></div>
        <div class="mall-skeleton"></div>
        <div class="mall-skeleton"></div>
      </div>
      <p id="mall-empty" class="mall-empty" hidden>没有找到相关商品，换个关键词试试。</p>
      <p id="mall-error" class="mall-error" role="alert" hidden></p>
    </section>
  </main>

  <footer class="mall-footer">
    <p>云裳商城 · 衣见 ATELIER 内置模拟商城</p>
    <p>商品图与页面素材均来自本地，演示过程中不会产生真实扣款、不会登录真实电商账号。</p>
  </footer>

  <script src="mall.js"></script>
</body>
</html>
